name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  container-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build --tag devops-pipeline-lab:ci .

      - name: Run container and check health and info endpoints
        shell: bash
        run: |
          set -euo pipefail
          container_name=devops-pipeline-lab-ci
          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name "$container_name" --publish 10000:10000 \
            --env PORT=10000 \
            --env APP_VERSION=ci-test \
            --env APP_ENV=ci \
            devops-pipeline-lab:ci

          container_uid=$(docker exec "$container_name" id -u)
          if [[ "$container_uid" == "0" ]]; then
            echo "Container is running as root"
            exit 1
          fi
          echo "Container runs as UID $container_uid"

          for attempt in {1..15}; do
            if response=$(curl --fail --silent http://127.0.0.1:10000/health); then
              if [[ "$response" == '{"status":"ok"}' ]]; then
                echo "Health endpoint returned $response"
                break
              fi
            fi
            if [[ "$attempt" == "15" ]]; then
              docker logs "$container_name"
              exit 1
            fi
            sleep 1
          done

          info=$(curl --fail --silent http://127.0.0.1:10000/info)
          expected='{"service":"DevOps Pipeline Lab","version":"ci-test","environment":"ci"}'
          if [[ "$info" != "$expected" ]]; then
            echo "Expected $expected, got $info"
            docker logs "$container_name"
            exit 1
          fi
          echo "Info endpoint returned $info"

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: container-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish image
        env:
          IMAGE_NAME: ghcr.io/1staugusto/devops-pipeline-lab
        run: |
          docker build --tag "$IMAGE_NAME:latest" --tag "$IMAGE_NAME:${GITHUB_SHA::7}" .
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${GITHUB_SHA::7}"
